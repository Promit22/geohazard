        <form id="config-form" action="" novalidate>
          <div id="static">
            <h2>Configure</h2>

            <div class="input-group">
              <label for="hazard-type">Hazard type</label>
              <div class="select-wrapper">
                <select id="hazard-type" name="hazard">
                  <option value="earthquake" selected>Earthquake</option>
                  <option value="flood">Flood</option>
                </select>
              </div>
              <span class="error-msg"></span>
            </div>

            <div class="input-group">
              <label for="country">Country</label>
              <input
                type="text"
                id="country"
                name="country"
                placeholder="e.g. Japan"
              />
              <span class="error-msg"></span>
            </div>

            <div class="input-group">
              <label for="start-time">Start time</label>
              <input type="date" id="start-time" name="start-time" />
              <span class="error-msg"></span>
            </div>

            <div class="input-group">
              <label for="end-time">End time</label>
              <input type="date" id="end-time" name="end-time" />
              <span class="error-msg"></span>
            </div>
          </div>

          <div id="dynamic"></div>
          <button type="submit">Analyze</button>
        </form>
      </section>
      <section id="map-container">
        <div id="map"></div>
      </section>
      <section id="analysis">
        <div id="earthquake-details"></div>
        <div id="ex-summary"></div>
      </section>
    </main>
